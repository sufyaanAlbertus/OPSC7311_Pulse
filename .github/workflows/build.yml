name: Android CI

# Builds, tests and publishes the Pulse APK.
# The Android project lives in Pulse_Project_Android_Studio_Files/Pulse.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: Pulse_Project_Android_Studio_Files/Pulse

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pulse_Project_Android_Studio_Files/Pulse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            Pulse_Project_Android_Studio_Files/Pulse/**/*.gradle*
            Pulse_Project_Android_Studio_Files/Pulse/**/gradle-wrapper.properties

      - name: Check Firebase config is present
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing from the repository."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Pulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-apk
          path: ${{ env.PROJECT_DIR }}/Pulse.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Pulse v2.0 (build ${{ github.run_number }})
          body: |
            Download Pulse.apk below on an Android phone (Android 8.0+), open it and tap Install.
            Test login: username `lecturer` · password `Pulse@2026`
          files: ${{ env.PROJECT_DIR }}/Pulse.apk
          make_latest: true
